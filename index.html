<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BAIMLUAA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #080908;
      --panel: #101210;
      --panel-2: #141614;
      --border: rgba(255,255,255,.08);

      --text: #f2f4ef;
      --muted: #777c75;

      --green: #a7ff00;
      --green-dark: #83d900;

      --red: #ff5f6d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 70% 20%,
          rgba(167,255,0,.035),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);

      font-family: Inter, sans-serif;

      overflow-x: hidden;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      width: 100%;
      height: 80px;

      display: flex;
      align-items: center;

      padding: 0 6vw;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;

      color: white;

      font-size: 14px;
      font-weight: 700;

      letter-spacing: -.03em;
    }

    .logo img {
      width: 36px;
      height: 36px;

      object-fit: cover;

      border-radius: 10px;

      border: 1px solid rgba(167,255,0,.18);
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width: min(1100px, 88%);

      min-height: calc(100vh - 130px);

      margin: auto;

      display: grid;

      grid-template-columns: 1fr 390px;

      align-items: center;

      gap: 90px;
    }

    /* =========================
       LEFT
    ========================= */

    .content {
      animation: appear .7s ease both;
    }

    .content h1 {
      font-size:
        clamp(42px, 6vw, 68px);

      line-height: .95;

      letter-spacing: -.065em;

      font-weight: 700;
    }

    .content h1 span {
      color: var(--green);
    }

    .resolver {
      margin-top: 38px;

      width: min(650px, 100%);
    }

    .input-box {
      display: flex;

      align-items: center;

      gap: 8px;

      padding: 6px;

      background: var(--panel);

      border: 1px solid var(--border);

      border-radius: 15px;

      transition:
        border-color .2s ease,
        box-shadow .2s ease;
    }

    .input-box:focus-within {
      border-color:
        rgba(167,255,0,.3);

      box-shadow:
        0 0 0 4px
        rgba(167,255,0,.035);
    }

    .input-icon {
      width: 40px;
      height: 40px;

      flex-shrink: 0;

      display: grid;
      place-items: center;

      color: var(--green);

      font-size: 15px;
    }

    #urlInput {
      flex: 1;

      min-width: 0;

      height: 42px;

      padding: 0 5px;

      border: none;
      outline: none;

      background: transparent;

      color: white;

      font-size: 13px;
    }

    #urlInput::placeholder {
      color: #555a54;
    }

    #bypassBtn {
      height: 42px;

      padding: 0 20px;

      border: none;

      border-radius: 10px;

      background: var(--green);

      color: #0b0d08;

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform .18s ease,
        background .18s ease,
        box-shadow .18s ease;
    }

    #bypassBtn:hover {
      background: #b5ff28;

      box-shadow:
        0 8px 25px
        rgba(167,255,0,.13);

      transform: translateY(-1px);
    }

    #bypassBtn:active {
      transform: scale(.96);
    }

    #bypassBtn:disabled {
      opacity: .5;
      cursor: wait;
      transform: none;
    }

    /* =========================
       RESULT
    ========================= */

    .result {
      display: none;

      margin-top: 12px;

      padding: 16px;

      background: var(--panel);

      border: 1px solid var(--border);

      border-radius: 15px;

      animation: resultIn .3s ease both;
    }

    .result.show {
      display: block;
    }

    .result-top {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-bottom: 14px;
    }

    .result-title {
      font-size: 11px;
      font-weight: 600;
    }

    .badge {
      padding: 4px 8px;

      border-radius: 999px;

      font-size: 8px;
      font-weight: 700;

      text-transform: uppercase;
    }

    .badge.success {
      color: var(--green);

      background:
        rgba(167,255,0,.07);
    }

    .badge.error {
      color: var(--red);

      background:
        rgba(255,95,109,.08);
    }

    .result-list {
      display: flex;

      flex-direction: column;

      gap: 8px;
    }

    .result-row {
      padding: 11px 12px;

      background: rgba(255,255,255,.025);

      border-radius: 9px;
    }

    .result-label {
      display: block;

      margin-bottom: 5px;

      color: var(--muted);

      font-size: 8px;

      text-transform: uppercase;

      letter-spacing: .08em;
    }

    .result-value {
      color: #dce0da;

      font-size: 11px;

      line-height: 1.5;

      word-break: break-all;
    }

    .destination {
      color: var(--green);
    }

    /* =========================
       ARTWORK
    ========================= */

    .visual {
      position: relative;

      display: flex;

      justify-content: center;

      align-items: center;

      animation:
        visualIn .9s .1s ease both;
    }

    .art {
      position: relative;

      width: 100%;
      max-width: 370px;

      aspect-ratio: 4 / 5;

      overflow: hidden;

      border-radius: 24px;

      border: 1px solid var(--border);

      background: #111;

      box-shadow:
        0 35px 80px
        rgba(0,0,0,.5);

      transform:
        rotate(2deg);

      transition:
        transform .5s ease,
        border-color .3s ease;
    }

    .art:hover {
      transform:
        rotate(0deg)
        translateY(-5px);

      border-color:
        rgba(167,255,0,.16);
    }

    .art img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }

    .art::after {
      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          transparent 55%,
          rgba(0,0,0,.25)
        );
    }

    /* =========================
       FLOATING LOGO
    ========================= */

    .floating-logo {
      position: absolute;

      left: -20px;
      bottom: 25px;

      width: 72px;
      height: 72px;

      padding: 6px;

      border-radius: 18px;

      background:
        rgba(10,11,10,.9);

      border:
        1px solid
        rgba(167,255,0,.18);

      box-shadow:
        0 20px 40px
        rgba(0,0,0,.45);

      animation:
        float 4s ease-in-out infinite;

      z-index: 2;
    }

    .floating-logo img {
      width: 100%;
      height: 100%;

      border-radius: 12px;

      object-fit: cover;
    }

    @keyframes float {

      0%,100% {
        transform:
          translateY(0)
          rotate(-4deg);
      }

      50% {
        transform:
          translateY(-7px)
          rotate(-2deg);
      }

    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      width: 88%;

      max-width: 1100px;

      margin: auto;

      padding: 25px 0;

      color: #464b45;

      font-size: 9px;
    }

    /* =========================
       LOADER
    ========================= */

    .loader {
      width: 13px;
      height: 13px;

      border-radius: 50%;

      border:
        2px solid
        rgba(0,0,0,.18);

      border-top-color:
        #0b0d08;

      animation:
        spin .65s linear infinite;
    }

    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }

    @keyframes appear {

      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    @keyframes visualIn {

      from {
        opacity: 0;
        transform:
          translateX(20px);
      }

      to {
        opacity: 1;
        transform:
          translateX(0);
      }

    }

    @keyframes resultIn {

      from {
        opacity: 0;
        transform: translateY(7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 850px) {

      header {
        padding: 0 6%;
      }

      main {
        width: 88%;

        grid-template-columns: 1fr;

        gap: 55px;

        padding:
          50px 0
          70px;
      }

      .content {
        text-align: center;
      }

      .resolver {
        margin-left: auto;
        margin-right: auto;
      }

      .visual {
        order: 2;
      }

      .art {
        max-width: 310px;
      }

      .floating-logo {
        left:
          calc(50% - 185px);
      }

      footer {
        text-align: center;
      }

    }

    @media (max-width: 500px) {

      .content h1 {
        font-size: 43px;
      }

      .input-box {
        flex-wrap: wrap;

        padding: 7px;
      }

      .input-icon {
        display: none;
      }

      #urlInput {
        flex-basis: 100%;

        height: 44px;

        padding: 0 10px;
      }

      #bypassBtn {
        width: 100%;
      }

      .art {
        max-width: 280px;
      }

      .floating-logo {
        left:
          calc(50% - 165px);

        width: 62px;
        height: 62px;
      }

    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }

    }
  </style>
</head>

<body>

  <header>

    <div class="logo">

      <img
        src="logo.png"
        alt="BAIMLUAA"
      >

      <span>BAIMLUAA</span>

    </div>

  </header>


  <main>

    <section class="content">

      <h1>
        Bypass<br>
        <span>SFL.</span>
      </h1>


      <div class="resolver">

        <div class="input-box">

          <div class="input-icon">
            ↗
          </div>

          <input
            id="urlInput"
            type="url"
            autocomplete="off"
            spellcheck="false"
            placeholder="Paste link..."
            value="https://sfl.gl/dyktx"
          >

          <button id="bypassBtn">
            <span id="buttonText">
              Bypass
            </span>
          </button>

        </div>


        <div
          class="result"
          id="resultArea"
        >

          <div class="result-top">

            <div class="result-title">
              Result
            </div>

            <div
              id="statusBadge"
              class="badge"
            >
              --
            </div>

          </div>

          <div
            class="result-list"
            id="resultContent"
          ></div>

        </div>

      </div>

    </section>


    <section class="visual">

      <div class="art">

        <img
          src="artwork.png"
          alt=""
        >

      </div>


      <div class="floating-logo">

        <img
          src="logo.png"
          alt="BAIMLUAA"
        >

      </div>

    </section>

  </main>


  <footer>
    BAIMLUAA
  </footer>


  <script>

    (() => {

      const input =
        document.getElementById("urlInput");

      const button =
        document.getElementById("bypassBtn");

      const buttonText =
        document.getElementById("buttonText");

      const result =
        document.getElementById("resultArea");

      const resultContent =
        document.getElementById("resultContent");

      const badge =
        document.getElementById("statusBadge");


      function escapeHtml(value) {

        if (
          value === null ||
          value === undefined ||
          value === ""
        ) {
          return "-";
        }

        const div =
          document.createElement("div");

        div.textContent =
          String(value);

        return div.innerHTML;

      }


      function loading(state) {

        button.disabled =
          state;

        if (state) {

          buttonText.innerHTML =
            `<span class="loader"></span>`;

        } else {

          buttonText.textContent =
            "Bypass";

        }

      }


      function showResult(data) {

        const success =
          data.status === "success";


        result.classList.add(
          "show"
        );


        badge.className =
          "badge " +
          (
            success
              ? "success"
              : "error"
          );


        badge.textContent =
          success
            ? "Success"
            : "Error";


        let html = `

          <div class="result-row">

            <span class="result-label">
              Input
            </span>

            <div class="result-value">
              ${escapeHtml(
                data.input_url
              )}
            </div>

          </div>

          <div class="result-row">

            <span class="result-label">
              Alias
            </span>

            <div class="result-value">
              ${escapeHtml(
                data.alias
              )}
            </div>

          </div>

        `;


        if (
          success &&
          data.destination
        ) {

          html += `

            <div class="result-row">

              <span class="result-label">
                Destination
              </span>

              <div class="result-value destination">
                ${escapeHtml(
                  data.destination
                )}
              </div>

            </div>

            <div class="result-row">

              <span class="result-label">
                Duration
              </span>

              <div class="result-value">
                ${escapeHtml(
                  data.duration || "-"
                )}
              </div>

            </div>

            <div class="result-row">

              <span class="result-label">
                Elapsed
              </span>

              <div class="result-value">
                ${escapeHtml(
                  data.elapsed_ms ?? "-"
                )} ms
              </div>

            </div>

          `;

        } else {

          html += `

            <div class="result-row">

              <span class="result-label">
                Error
              </span>

              <div
                class="result-value"
                style="color:var(--red)"
              >
                ${escapeHtml(
                  data.message ||
                  "Request failed."
                )}
              </div>

            </div>

          `;

        }


        resultContent.innerHTML =
          html;

      }


      async function bypass() {

        const url =
          input.value.trim();


        if (!url) {

          input.focus();

          return;

        }


        try {

          new URL(url);

        } catch {

          showResult({

            status: "error",

            input_url: url,

            message:
              "URL tidak valid."

          });

          return;

        }


        loading(true);

        result.classList.remove(
          "show"
        );


        try {

          const response =
            await fetch(
              "/api/bypass",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    url
                  })
              }
            );


          let data;


          try {

            data =
              await response.json();

          } catch {

            data = {

              status: "error",

              input_url: url,

              message:
                "Response server tidak valid."

            };

          }


          showResult(data);


        } catch (error) {

          showResult({

            status: "error",

            input_url: url,

            message:
              error.message ||
              "Gagal terhubung ke server."

          });

        } finally {

          loading(false);

        }

      }


      button.addEventListener(
        "click",
        bypass
      );


      input.addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Enter"
          ) {

            event.preventDefault();

            bypass();

          }

        }
      );

    })();

  </script>

</body>
</html>
